<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="robots" content="noindex, nofollow">
<title>TGA Store Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#05070b;
  --panel:#0b1018;
  --panel2:#0f1622;
  --border:#1c2534;
  --text:#eaf2ff;
  --muted:#7c8aa0;
  --green:#3df092;
  --green2:#0bd2ff;
  --red:#ff5c72;
}

html,body{
  height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  position:relative;
  overflow:hidden;
}

/* ambient glow background */
body::before{
  content:"";
  position:absolute;
  width:640px;
  height:640px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(61,240,146,.16),transparent 65%);
  top:-260px;
  right:-180px;
  animation:drift 11s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(11,210,255,.12),transparent 65%);
  bottom:-220px;
  left:-160px;
  animation:drift 13s ease-in-out infinite alternate-reverse;
}

@keyframes drift{
  from{ transform:translate(0,0); }
  to{ transform:translate(-40px,30px); }
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
  pointer-events:none;
}

.login-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:400px;
  background:linear-gradient(180deg,rgba(15,22,34,.92),rgba(11,16,24,.96));
  border:1px solid var(--border);
  border-radius:24px;
  padding:38px 30px 32px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    0 0 0 1px rgba(61,240,146,.05),
    0 0 60px rgba(61,240,146,.06);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(61,240,146,.1);
  border:1px solid rgba(61,240,146,.28);
  color:var(--green);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
  padding:6px 12px;
  border-radius:99px;
  margin-bottom:20px;
}

.badge .dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

.logo-row{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.logo{
  width:56px;
  height:56px;
  border-radius:16px;
  object-fit:contain;
  background:#fff;
  padding:5px;
}

.brand-title{
  font-size:24px;
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.1;
}

.brand-title span{
  background:linear-gradient(90deg,var(--green),var(--green2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:4px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.4px;
  margin-bottom:8px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px 15px;
  font:inherit;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}

.field input::placeholder{
  color:#4c5a70;
}

.field input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(61,240,146,.12);
}

.login-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:8px;
  font-weight:850;
  font-size:15px;
  letter-spacing:.4px;
  color:#04150c;
  cursor:pointer;
  background:linear-gradient(90deg,var(--green),var(--green2));
  box-shadow:0 8px 28px rgba(61,240,146,.28);
  transition:transform .15s, box-shadow .2s, opacity .2s;
}

.login-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 34px rgba(61,240,146,.36);
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.error{
  display:none;
  background:rgba(255,92,114,.1);
  border:1px solid rgba(255,92,114,.3);
  color:var(--red);
  font-size:13px;
  padding:11px 13px;
  border-radius:11px;
  margin-top:16px;
  line-height:1.5;
}

.foot{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.6px;
  margin-top:22px;
  text-transform:uppercase;
}

.foot a{
  color:var(--muted);
  text-decoration:none;
}

.foot a:hover{
  color:var(--text);
}
</style>
</head>
<body>

<div class="grid"></div>

<div class="login-card">

  <div class="badge">
    <span class="dot"></span>
    Secure Admin Access
  </div>

  <div class="logo-row">
    <img class="logo" src="https://files.catbox.moe/zsgsqb.png" alt="TGA">
    <div>
      <div class="brand-title">TGA <span>Store</span></div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <div class="field">
    <label for="adminIdInput">Admin ID</label>
    <input
      id="adminIdInput"
      type="text"
      autocomplete="username"
      placeholder="Enter your admin ID"
    >
  </div>

  <div class="field">
    <label for="adminPasswordInput">Password</label>
    <input
      id="adminPasswordInput"
      type="password"
      autocomplete="current-password"
      placeholder="Enter your password"
    >
  </div>

  <button id="loginBtn" class="login-btn" type="button" onclick="handleAdminLogin()">
    Enter Panel
  </button>

  <div id="loginError" class="error"></div>

  <div class="foot">
    TGA Store Admin Panel · Internal use only
  </div>

</div>

<script>
function showError(message){
  var el = document.getElementById("loginError");
  el.textContent = message;
  el.style.display = "block";
}

function hideError(){
  var el = document.getElementById("loginError");
  el.textContent = "";
  el.style.display = "none";
}

async function handleAdminLogin(){
  var id = document.getElementById("adminIdInput").value.trim();
  var password = document.getElementById("adminPasswordInput").value;
  var btn = document.getElementById("loginBtn");

  hideError();

  if(!id || !password){
    showError("Enter your admin ID and password.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Verifying...";

  try{
    var response = await fetch("/api/admin_login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({ id: id, password: password })
    });

    var result = await response.json();

    if(!response.ok || !result.success){
      showError(result.message || "Login failed.");
      return;
    }

    sessionStorage.setItem("tga_admin_token", result.token);
    window.location.replace("/admin.html");

  }catch(error){
    console.error("Admin login:", error);
    showError("Unable to connect to server.");
  }finally{
    btn.disabled = false;
    btn.textContent = "Enter Panel";
  }
}

if(sessionStorage.getItem("tga_admin_token")){
  window.location.replace("/admin.html");
}

document.getElementById("adminPasswordInput").addEventListener("keydown", function(event){
  if(event.key === "Enter"){
    handleAdminLogin();
  }
});

document.getElementById("adminIdInput").addEventListener("keydown", function(event){
  if(event.key === "Enter"){
    document.getElementById("adminPasswordInput").focus();
  }
});
</script>

</body>
</html>
